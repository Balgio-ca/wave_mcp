services:
  deck:
    build: .
    container_name: deck
    # OBLIGATOIRE : le pairing Android TV (mDNS/TLS), adb et le scan réseau
    # échouent tous en mode bridge.
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: "8099"
      DATA_DIR: "/app/data"
      # Marque affichée (modifiable ensuite dans les réglages de l'app).
      BRAND_NAME: "MANCAVE"
      TAGLINE: "multi tv universal remote"
      # --- Amorçage (facultatif) ---
      # Au TOUT premier démarrage, si data/devices.json n'existe pas encore,
      # ces variables créent automatiquement deux appareils. Ensuite, tout se
      # gère dans l'app (scan réseau / ajout manuel) et elles sont ignorées.
      SHIELD_HOST: "192.168.0.70"
      FIRETV_HOST: "192.168.0.13"
      FIRETV_PORT: "5555"
    volumes:
      # Persiste le registre d'appareils, les scènes, les certificats de
      # pairing et les niveaux audio mémorisés. À conserver.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
