services:
  salon-tv:
    build: .
    container_name: salon-tv
    # OBLIGATOIRE : le pairing du Shield (mDNS/TLS) et adb échouent en mode bridge.
    network_mode: host
    restart: unless-stopped
    environment:
      # --- Adresses des TV (modifiables ici à tout moment) ---
      SHIELD_HOST: "192.168.0.70"   # Nvidia Shield Pro
      FIRETV_HOST: "192.168.0.13"   # TCL Fire TV (« mathieu's TV »)
      FIRETV_PORT: "5555"
      # --- Service ---
      PORT: "8099"
      DATA_DIR: "/app/data"
    volumes:
      # Persiste le certificat de pairing Shield et l'intent mute Fire TV.
      - ./data:/app/data
